<!DOCTYPE html>
<html lang="en">

<head>
  <meta http-equiv="Content-Security-Policy"
    content="script-src 'nonce-aem' 'strict-dynamic' 'unsafe-inline' http: https:; base-uri 'self'; object-src 'none';"
    move-to-http-header="true">
  <title>Page Not Found</title>
  <script nonce="aem" type="text/javascript">
    window.isErrorPage = true;
    window.errorCode = "404";
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta property="og:title" content="Page not found">
  <script nonce="aem" src="/scripts/scripts.js" type="module"></script>
  <script nonce="aem" type="module">
    window.addEventListener('load', () => {
      if (document.referrer) {
        const { origin, pathname } = new URL(document.referrer);
        if (origin === window.location.origin) {
          const backBtn = document.createElement('a');
          backBtn.classList.add('button', 'error-button-back');
          backBtn.href = pathname;
          backBtn.textContent = 'Go back';
          backBtn.title = 'Go back';
          const btnContainer = document.querySelector('.button-container');
          btnContainer.append(backBtn);
        }
      }
    });
  </script>
  <script nonce="aem" type="module">
    import { sampleRUM } from '/scripts/aem.js';
    sampleRUM('404', { source: document.referrer });
  </script>
  <link rel="stylesheet" href="/styles/styles.css">
  <style>
    main.error {
      min-height: calc(100vh - var(--nav-height));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    main.error .section {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 24px;
      text-align: center;
    }

    .error-number {
      width: 100%;
      max-width: 450px;
      margin: 0 auto 40px;
      color: #22c55e;
    }

    .error-number text {
      font-family: monospace;
      font-size: 18px;
      font-weight: 700;
    }

    .error-message {
      font-size: clamp(2rem, 5vw, 3.5rem);
      line-height: 1.2;
      margin-bottom: 20px;
      color: #111827;
    }

    .error-description {
      max-width: 700px;
      margin: 0 auto 40px;
      color: #6b7280;
      font-size: 18px;
      line-height: 1.7;
    }

    .button-container {
      width: 100%;
      align-items: center;
      height: 48px;
      border-radius: 999px;
      text-decoration: none;
      margin-top: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .button-container a:hover {
      text-decoration: none;
    }

    .error-button-home,
    .error-button-back {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
      padding: 14px 28px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .error-button-home {
      background: #22c55e;
      color: #fff;
    }

    .error-button-home:hover {
      background: #16a34a;
      text-decoration: none;
    }

    .error-button-back {
      border: 1px solid #22c55e;
      color: #22c55e;
      background: #fff;
    }

    .error-button-back:hover {
      background: #f0fdf4;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .error-message {
        font-size: 2rem;
      }

      .error-description {
        font-size: 16px;
      }

      .button-container {
        flex-direction: column;
        align-items: center;
      }

      .error-button-home,
      .error-button-back {
        width: 100%;
        max-width: 300px;
      }
    }
  </style>
</head>

<body>
  <header></header>
  <main class="error">
    <div class="section">
      <svg viewBox="1 0 38 18" class="error-number">
        <text x="0" y="17">404</text>
      </svg>
      <h1 class="error-message">
        We can’t find the page you’re looking for.
      </h1>
      <p class="error-description">
        But while you're here, why don't you have a look around and continue exploring our products.
      </p>
      <div class="button-container">
        <a href="/shop">
          Continue Shopping
        </a>
      </div>
    </div>
  </main>
  <footer></footer>
</body>

</html>
